services:
  postgres:
    image: postgres:16-alpine
    container_name: epicor_pilot_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: epicor_pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epicor_pilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
